# Builds the iOS app and packages it as an .ipa, so a phone build can be had
# without owning a Mac. The .ipa is unsigned: iOS will not install it as it is,
# it has to be signed first, for example with Sideloadly and your own Apple ID.
#
# Run it by hand from the Actions tab, or let it run on a push to a branch whose
# name starts with "ios".
name: iOS app

on:
  workflow_dispatch:
  push:
    branches:
      - ios**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The name shown under the icon on the phone, and the name of the bundle.
  APP_NAME: DDDa
  # Has to be unique to whoever signs it. Sideloadly rewrites this anyway when
  # it signs with a free Apple ID, because those cannot reuse an identifier.
  BUNDLE_ID: com.ddda.client

jobs:
  build:
    runs-on: macos-26
    env:
      CARGO_HTTP_MULTIPLEXING: false
    steps:
    - uses: actions/checkout@v5

    # ddnet-libs is not committed to this repository, so the prebuilt iOS
    # xcframeworks have to be fetched before CMake looks for them.
    - name: Fetch ddnet-libs
      run: git clone --depth 1 https://github.com/ddnet/ddnet-libs ddnet-libs

    - name: Prepare macOS
      run: |
        sudo xcode-select -s "/Applications/Xcode_26.2.app/Contents/Developer"
        xcodebuild -version
        rustup target add aarch64-apple-ios
        rustup target add aarch64-apple-ios-sim

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2.9.2
      with:
          cache-bin: false # WORKAROUND(https://github.com/Swatinem/rust-cache/issues/341)
          workspaces: ./

    - name: Build iOS simulator app in debug mode
      run: scripts/ios/cmake_ios.sh sim-arm64 "$APP_NAME" "$BUNDLE_ID" Debug build-ios-sim

    # Proves the app actually starts on iOS rather than only compiling for it.
    - name: Smoke test iOS simulator app in debug mode
      timeout-minutes: 15
      run: |
        UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(device["udid"] for devices in json.load(sys.stdin)["devices"].values() for device in devices if "iPhone" in device["name"]))')
        xcrun simctl bootstatus "$UDID" -b
        xcrun simctl install "$UDID" "build-ios-sim/Debug-iphonesimulator/$APP_NAME.app"
        xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" quit > simulator-console.log 2>&1
        cat simulator-console.log
        grep -q "config: saved to settings_ddnet.cfg" simulator-console.log

    - name: Build iOS device app in release mode
      run: scripts/ios/cmake_ios.sh device "$APP_NAME" "$BUNDLE_ID" Release build-ios-device

    - name: Package
      run: |
        mkdir artifacts
        mkdir Payload
        mv "build-ios-device/Release-iphoneos/$APP_NAME.app" Payload
        zip -qry "artifacts/$APP_NAME.ipa" Payload
        ls -lh artifacts

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ddda-ios-ipa
        path: artifacts
