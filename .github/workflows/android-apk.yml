# Builds the Android client and leaves a signed .apk as its artifact.
#
# The apk is signed with a key kept in this repository's secrets, never in the
# tree. That the key stays the same between releases is the point of keeping it
# at all: Android refuses to install an update whose signature differs from the
# copy already on the phone, so a fresh key every build would mean uninstalling
# the game, and its settings, on every update. When the secrets are absent the
# build still runs and Gradle signs with its own debug key, which is fine for
# trying the thing out and useless for updating it.
#
# Run it by hand from the Actions tab, or let it run on a push to a branch whose
# name starts with "android".
name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The native library keeps upstream's name: the build script copies libDDNet.so
  # by that name, and the game name it takes has to match it. Only the label under
  # the icon and the package say Leviathan.
  GAME_NAME: DDNet
  PACKAGE_NAME: com.leviathan.client
  APK_NAME: Leviathan

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5

    # ddnet-libs is neither committed here nor a submodule, and it carries the
    # prebuilt Android libraries the client links against.
    - name: Fetch ddnet-libs
      run: git clone --depth 1 https://github.com/ddnet/ddnet-libs ddnet-libs

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    # The runner image ships an Android SDK, but not the NDK version the build
    # script expects, so the project's own downloader is used. It also accepts
    # the SDK licenses, without which Gradle refuses to build.
    - name: Download the Android SDK and NDK
      run: |
        # The runner image presets ANDROID_HOME to its own SDK, which does not
        # carry the NDK version this build wants. Both the downloader and the
        # build below are pointed at a fresh one instead.
        echo "ANDROID_HOME=$HOME/Android/Sdk" >> "$GITHUB_ENV"
        scripts/android/download_android_sdk.sh

    # A stable Rust: the documentation is explicit that nightly produces linking
    # errors here.
    - name: Set up Rust
      run: |
        rustup default 1.92.0
        rustup target add armv7-linux-androideabi
        rustup target add aarch64-linux-android
        rustup target add i686-linux-android
        rustup target add x86_64-linux-android

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2.9.2
      with:
        cache-bin: false # WORKAROUND(https://github.com/Swatinem/rust-cache/issues/341)
        workspaces: ./

    - name: Install cargo-ndk
      run: cargo install cargo-ndk --locked

    # The keystore is written outside the checkout so a stray `git add -A` in a
    # later step could not sweep it into a commit.
    - name: Restore the signing key
      id: signing
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "No signing key in the secrets: Gradle will use its own debug key."
          echo "signed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/leviathan.jks"
        echo "signed=true" >> "$GITHUB_OUTPUT"
        ls -l "$RUNNER_TEMP/leviathan.jks"

    - name: Build the APK
      env:
        TW_KEY_NAME: ${{ steps.signing.outputs.signed == 'true' && format('{0}/leviathan.jks', runner.temp) || '' }}
        TW_KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        TW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        # An empty TW_KEY_NAME would be taken as "a key path was passed" and used
        # as one, so it is unset rather than left empty when there is no key.
        if [ -z "$TW_KEY_NAME" ]; then
          unset TW_KEY_NAME TW_KEY_PW TW_KEY_ALIAS
        fi
        scripts/android/cmake_android.sh all "$GAME_NAME" "$PACKAGE_NAME" Release build-android

    - name: Collect the APK
      run: |
        mkdir artifacts
        # One apk carrying every architecture, which is what a person sideloading
        # wants: no guessing which one their phone is.
        APK="$(find build-android -name '*.apk' -path '*release*' | head -1)"
        if [ -z "$APK" ]; then
          echo "No release apk was produced. What is there:"
          find build-android -name '*.apk' -print
          exit 1
        fi
        VERSION="$(grep '#define GAME_RELEASE_VERSION_INTERNAL' src/game/version.h | awk '{print $3}' | tr -d '"')"
        cp "$APK" "artifacts/${APK_NAME}-${VERSION}-android.apk"
        ls -lh artifacts

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: leviathan-android-apk
        path: artifacts
